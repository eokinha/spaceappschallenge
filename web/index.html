<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Análogos Terra · Lua · Marte</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Globos 3D da Lua, da Terra e de Marte"></canvas>
  <header>
    <h1>Análogos Terra · Lua · Marte</h1>
    <span id="status">Carregando…</span>
    <button type="button" id="list-toggle" aria-controls="site-list" aria-expanded="false">Locais</button>
  </header>
  <div class="labels" aria-hidden="true">
    <span style="--c:#9fd3ff">Alvo na Lua</span>
    <span class="analog" style="--c:#5dffa0">Análogo na Terra</span>
    <span style="--c:#ff7a45">Alvo em Marte</span>
  </div>
  <nav id="site-list" aria-label="Lista de locais"></nav>
  <aside id="panel" hidden></aside>
  <div id="legend" hidden></div>
  <div id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
